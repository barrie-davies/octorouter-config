# Office deployment overrides (the 2x RTX 3090 Ubuntu machine, reached over Tailscale).
#
# bootstrap.sh installs this as /opt/octorouter/docker-compose.override.yml. Docker Compose loads that
# file automatically on every command run in /opt/octorouter, including the dashboard's deploy webhook,
# so services/docker-compose.yml stays identical to the EC2 original.
#
# Differences from EC2:
# - Caddy does not run: `tailscale serve` terminates HTTPS on the tailnet instead, so nothing binds the
#   host's ports 80/443 and nothing is reachable from the office LAN or the internet.
# - cliproxyapi and the dashboard are published on loopback only, for `tailscale serve` to forward to.
#   18317/13000 avoid the legacy local router (8317) and common dev-server ports (3000).
# - The dashboard's public URLs come from .env (the machine's Tailscale name) instead of octinho.com.
services:
  caddy:
    profiles: ["ec2"]

  cliproxyapi:
    ports:
      - "127.0.0.1:18317:8317"

  dashboard:
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      DASHBOARD_URL: ${DASHBOARD_URL}
      API_URL: ${API_URL}
