# CLIProxyAPI Configuration Template
# Copy this file to config.yaml and fill in your values
# NEVER commit config.yaml — it contains secrets!
#
# EC2/Docker deployment: auth-dir is /root/.cli-proxy-api (container path)
# Full reference: https://github.com/router-for-me/CLIProxyAPI/blob/main/config.example.yaml

host: ""
port: 8317

# Caddy reaches cliproxyapi over the cliproxyapi_frontend bridge, so without
# this every client resolves to Caddy's container IP. Since v7.3.x (a962b77d)
# the default [] ignores X-Forwarded-For, which makes the management
# failed-login ban (5 failures -> 30 min) lock out every user at once.
trusted-proxies:
  - 172.16.0.0/12

tls:
  enable: false
  cert: ""
  key: ""

remote-management:
  # true: required when dashboard reaches cliproxyapi over Docker network (not localhost)
  allow-remote: true
  # Set via MANAGEMENT_PASSWORD env var — leave empty here
  secret-key: ""
  disable-control-panel: false
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

auth-dir: "/root/.cli-proxy-api"

api-keys:
  - "my-cliproxy-key"

debug: false

pprof:
  enable: false
  addr: "127.0.0.1:8316"

commercial-mode: false
logging-to-file: false
logs-max-total-size-mb: 0
error-logs-max-files: 10
usage-statistics-enabled: false
proxy-url: ""
force-model-prefix: false
passthrough-headers: false
request-retry: 3
max-retry-credentials: 0
max-retry-interval: 30

quota-exceeded:
  switch-project: true
  switch-preview-model: true

routing:
  strategy: "round-robin"

ws-auth: false
nonstream-keepalive-interval: 0

oauth-model-alias:
  claude:
    - name: claude-haiku-4-5-20251001
      alias: claude-haiku-4-5
      fork: true

# ---------------------------------------------------------------------------
# Provider credentials — uncomment and populate as needed
# Full reference: https://github.com/router-for-me/CLIProxyAPI/blob/main/config.example.yaml
